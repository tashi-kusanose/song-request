<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09080d">
<title>SONG REQUEST</title>
<style>
:root{--bg:#09080d;--panel:#17131f;--line:rgba(255,255,255,.09);--text:#faf8ff;--muted:#a39aaa;--pink:#ff4fa3;--purple:#8a62ff;--mint:#55dfbd}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg)}body{color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:radial-gradient(circle at 10% -5%,rgba(255,79,163,.15),transparent 28%),radial-gradient(circle at 96% 4%,rgba(138,98,255,.15),transparent 24%),#09080d}button,input,select,textarea{font:inherit}.app{width:min(100%,520px);min-height:100dvh;margin:auto}.hero{position:relative;min-height:168px;padding:calc(13px + env(safe-area-inset-top)) 18px 10px;overflow:hidden;background:radial-gradient(circle at 82% 24%,rgba(255,80,166,.18),transparent 25%)}.eyebrow{font-size:9.5px;font-weight:900;letter-spacing:.30em;color:#d8cfdf}h1{margin:5px 0 0;font:500 clamp(34px,8.8vw,48px)/.94 Georgia,serif;letter-spacing:-.04em}.streamer{margin-top:7px;color:#ffc9e3;font-size:11px;font-weight:900;letter-spacing:.07em}.hero p{margin:9px 0;color:#d9d2e1;font-size:12px;line-height:1.55}.count{display:inline-flex;gap:8px;align-items:center;padding:6px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(20,17,28,.58);font-size:12px}.count b{font-size:16px}.mic{position:absolute;right:20px;top:48px;font-size:50px;opacity:.42;transform:rotate(-18deg)}.secret{position:absolute;right:9px;bottom:1px;width:30px;height:26px;border:0;background:transparent;color:rgba(255,255,255,.18);font-size:18px}.tools{position:sticky;top:0;z-index:20;padding:12px 16px;background:linear-gradient(180deg,rgba(9,8,13,.98),rgba(9,8,13,.9));backdrop-filter:blur(16px)}.search{width:100%;height:54px;border-radius:18px;border:1px solid rgba(255,255,255,.13);background:#18151f;color:#fff;outline:none;padding:0 16px;font-size:15px}.row{display:flex;gap:8px;overflow:auto;padding:10px 0 1px;scrollbar-width:none}.row::-webkit-scrollbar{display:none}.chip,.kana{flex:0 0 auto;border:1px solid var(--line);background:#18151f;color:#bbb2c3;font-weight:850}.chip{height:38px;padding:0 14px;border-radius:999px;font-size:12px}.chip.active{color:#fff;border-color:transparent;background:linear-gradient(105deg,var(--pink),#bd4cff,var(--purple))}.kana{width:35px;height:34px;border-radius:10px;font-size:11px}.kana.active{color:#fff;border-color:rgba(255,100,185,.4);background:#2b2337}main{padding:6px 16px calc(98px + env(safe-area-inset-bottom))}.head{display:flex;justify-content:space-between;align-items:end;padding:8px 2px 10px}.head h2{font-size:14px;margin:0}.head span{font-size:11px;color:var(--muted)}.list{display:grid;gap:10px}.card{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:11px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(180deg,#1b1723,#111017)}.cover{width:58px;height:58px;border-radius:15px;display:grid;place-items:center;font-size:26px;background:linear-gradient(145deg,#30306b,#76266f 55%,#181633);box-shadow:0 7px 18px rgba(0,0,0,.25)}.info{min-width:0}.title{font-size:15px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{margin-top:4px;font-size:12px;color:#a79fac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.tag{padding:3px 7px;border-radius:999px;border:1px solid #31283c;background:#211b2a;color:#aaa0b6;font-size:9px;font-weight:900}.tag.p{color:#ffc7df;border-color:rgba(255,79,163,.43);background:rgba(255,79,163,.1)}.tag.w{color:#ffd79e;border-color:rgba(255,185,90,.38)}.acts{display:grid;grid-template-columns:36px 1fr;gap:6px}.fav,.edit{width:36px;height:36px;border-radius:11px;border:1px solid rgba(255,255,255,.1);background:#17141e;color:#aaa1b0}.fav.on{color:#ff70b5}.edit{display:none}.admin .edit{display:block}.admin .acts{grid-template-columns:36px 36px 1fr}.req{height:36px;border:0;border-radius:12px;padding:0 12px;color:#fff;font-size:11px;font-weight:900;background:linear-gradient(105deg,var(--pink),#c14dff,var(--purple))}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,520px);padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(9,8,13,.05),#09080d 28%);z-index:30}.nav{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;padding:5px;border:1px solid rgba(255,255,255,.08);border-radius:22px;background:#121018}.nav button{height:52px;border:0;background:transparent;color:#847d8d;font-size:10px;font-weight:900}.nav button.active{color:#fff}.empty{text-align:center;padding:55px 20px;color:#9b93a3}.overlay{display:none;position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.62);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}.overlay.show{display:flex}.sheet{width:min(100%,520px);max-height:92dvh;overflow:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));border-radius:27px 27px 0 0;background:linear-gradient(180deg,#211b2c,#0f0d15);border:1px solid rgba(255,255,255,.1)}.sheet h3{margin:0 0 6px}.sub{color:#a69dad;font-size:12px;line-height:1.6}.box{padding:13px;border-radius:14px;background:#17131e;border:1px solid var(--line);font-size:13px}.field{display:grid;gap:6px;margin-top:9px}.field label{font-size:11px;color:#bbb3c4}.input,.select,.textarea{width:100%;border-radius:12px;border:1px solid var(--line);background:#14111a;color:#fff;outline:none;padding:0 12px}.input,.select{height:44px}.textarea{min-height:72px;padding-top:10px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.check{font-size:11px;padding:9px;border-radius:11px;background:#17131e;border:1px solid var(--line)}.btnrow{display:grid;grid-template-columns:1fr 1.5fr;gap:8px;margin-top:12px}.btn{height:46px;border:0;border-radius:13px;font-weight:900}.ghost{background:#25212b;color:#ccc4d1}.primary{color:#fff;background:linear-gradient(105deg,var(--pink),#bd4cff,var(--purple))}.danger{width:100%;margin-top:8px;color:#ff9aaa;background:rgba(255,92,115,.1);border:1px solid rgba(255,92,115,.3)}.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);width:min(calc(100% - 30px),480px);padding:11px 13px;border-radius:14px;background:#1c1825;border:1px solid rgba(255,255,255,.12);opacity:0;pointer-events:none;transition:.2s;z-index:80;font-size:12px}.toast.show{opacity:1;transform:translate(-50%,0)}.fab{display:none;position:fixed;right:18px;bottom:92px;z-index:40;height:46px;padding:0 15px;border:0;border-radius:14px;color:#fff;font-weight:900;background:linear-gradient(105deg,var(--pink),#bd4cff,var(--purple))}.admin .fab{display:block}@media(max-width:390px){.card{grid-template-columns:54px minmax(0,1fr)}.cover{width:54px;height:54px}.acts{grid-column:2}.admin .acts{grid-template-columns:36px 36px 1fr}}
</style>
</head>
<body>
<div class="app" id="app">
<section class="hero"><div class="eyebrow">LIVE SONG LIST</div><h1 id="pageTitle">SONG REQUEST</h1><div id="streamer" class="streamer">読み込み中…</div><p id="heroMessage">あなたのリクエストが、<br>この夜のステージをつくる。</p><div class="count">🎵 <b id="total">—</b> songs</div><div class="mic">🎙️</div><button id="secret" class="secret" aria-label="その他">⋯</button></section>
<section class="tools"><input id="search" class="search" placeholder="曲名・アーティスト名で検索"><div class="row" id="filters"><button class="chip active" data-f="all">すべて</button><button class="chip" data-f="original">オリジナル</button><button class="chip" data-f="recommend">おすすめ</button><button class="chip" data-f="popular">よく歌う</button><button class="chip" data-f="new">新曲</button><button class="chip" data-f="limited">▲注記あり</button><button class="chip" data-f="favorite">お気に入り</button></div><div class="row" id="kana"><button class="kana active" data-k="all">全</button><button class="kana" data-k="あ">あ</button><button class="kana" data-k="か">か</button><button class="kana" data-k="さ">さ</button><button class="kana" data-k="た">た</button><button class="kana" data-k="な">な</button><button class="kana" data-k="は">は</button><button class="kana" data-k="ま">ま</button><button class="kana" data-k="や">や</button><button class="kana" data-k="ら">ら</button><button class="kana" data-k="わ">わ</button><button class="kana" data-k="AZ">A-Z</button></div></section>
<main><div class="head"><h2 id="sectionTitle">歌える曲</h2><span id="resultCount"></span></div><div id="list" class="list"><div class="empty">読み込み中…</div></div></main>
</div>
<button id="fab" class="fab">＋ 曲を追加</button>
<div class="bottom"><div class="nav"><button class="active" data-nav="all">⌂<br>HOME</button><button id="navSearch">⌕<br>検索</button><button data-nav="favorite">♡<br>お気に入り</button><button data-nav="new">✦<br>新曲</button></div></div>
<div id="toast" class="toast"></div>
<div id="request" class="overlay"><div class="sheet"><h3 id="reqTitle"></h3><p class="sub">下の文章をコピーしてLIVEコメント欄へ貼り付けてください。</p><div id="copyText" class="box"></div><div class="btnrow"><button class="btn ghost" data-close="request">閉じる</button><button id="copyBtn" class="btn primary">コピー</button></div></div></div>
<div id="admin" class="overlay"><div class="sheet"><div id="login"><h3 id="adminTitle">管理モード</h3><p class="sub">配信者専用PWを入力してください。</p><div class="field"><label>管理PW</label><input id="pw" class="input" type="password"></div><div class="btnrow"><button class="btn ghost" data-close="admin">閉じる</button><button id="loginBtn" class="btn primary">ログイン</button></div></div><div id="menu" hidden><h3>管理モード</h3><p class="sub">曲の追加・編集・削除ができます。</p><div class="btnrow"><button id="logoutBtn" class="btn ghost">ログアウト</button><button id="addBtn" class="btn primary">＋ 曲を追加</button></div><button id="changePw" class="btn ghost" style="width:100%;margin-top:8px">PW変更</button></div></div></div>
<div id="edit" class="overlay"><div class="sheet"><h3 id="editTitle">曲を追加</h3><input id="songId" type="hidden"><div class="field"><label>曲名 *</label><input id="fTitle" class="input"></div><div class="field"><label>アーティスト名 *</label><input id="fArtist" class="input"></div><div class="field"><label>50音</label><select id="fKana" class="select"><option>オリジナル</option><option>あ</option><option>い</option><option>う</option><option>え</option><option>お</option><option>か</option><option>き</option><option>く</option><option>け</option><option>こ</option><option>さ</option><option>し</option><option>す</option><option>せ</option><option>そ</option><option>た</option><option>ち</option><option>つ</option><option>て</option><option>と</option><option>な</option><option>に</option><option>ぬ</option><option>ね</option><option>の</option><option>は</option><option>ひ</option><option>ふ</option><option>へ</option><option>ほ</option><option>ま</option><option>み</option><option>む</option><option>め</option><option>も</option><option>や</option><option>ゆ</option><option>よ</option><option>ら</option><option>り</option><option>る</option><option>れ</option><option>ろ</option><option>わ</option><option>その他</option></select></div><div class="field"><label>注記</label><textarea id="fNote" class="textarea"></textarea></div><div class="checks"><label class="check"><input id="fOriginal" type="checkbox">オリジナル</label><label class="check"><input id="fLimited" type="checkbox">▲注記あり</label><label class="check"><input id="fRecommend" type="checkbox">おすすめ</label><label class="check"><input id="fPopular" type="checkbox">よく歌う</label><label class="check"><input id="fNew" type="checkbox">新曲</label><label class="check"><input id="fActive" type="checkbox" checked>公開</label></div><div class="btnrow"><button class="btn ghost" data-close="edit">キャンセル</button><button id="saveBtn" class="btn primary">保存</button></div><button id="deleteBtn" class="btn danger">この曲を削除</button></div></div>
<div id="pwchange" class="overlay"><div class="sheet"><h3>管理PW変更</h3><div class="field"><label>新しいPW</label><input id="newPw" class="input" type="password"></div><div class="field"><label>もう一度入力</label><input id="newPw2" class="input" type="password"></div><div class="btnrow"><button class="btn ghost" data-close="pwchange">キャンセル</button><button id="savePw" class="btn primary">変更</button></div></div></div>
<script>
const URL='https://esfgrykcvdctnvdqipbj.supabase.co',KEY='sb_publishable_Rwb3qaRXdWZoo05LrbFaDg_29tMI7uI',ADMIN=URL+'/functions/v1/song-request-admin';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function roomSlug(){const q=new URLSearchParams(location.search).get('room');return(q||'natsumi').trim().toLowerCase()}
const SLUG=roomSlug(),TOKKEY='song_admin_'+SLUG,FAVKEY='song_fav_'+SLUG;let room=null,songs=[],selected=null,token=sessionStorage.getItem(TOKKEY)||'',state={f:'all',k:'all',q:''};let fav=new Set(JSON.parse(localStorage.getItem(FAVKEY)||'[]'));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const norm=s=>String(s||'').normalize('NFKC').toLowerCase().replace(/\s+/g,'');
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(window._t);window._t=setTimeout(()=>$('#toast').classList.remove('show'),1800)}function open(id){$('#'+id).classList.add('show')}function close(id){$('#'+id).classList.remove('show')}
async function load(){try{let r=await fetch(URL+'/rest/v1/song_request_streamers?slug=eq.'+encodeURIComponent(SLUG)+'&active=eq.true&select=id,display_name,page_title,hero_message',{headers:{apikey:KEY}});let a=await r.json();room=a[0];if(!room)throw Error('ROOM');$('#streamer').textContent=room.display_name;$('#pageTitle').textContent=room.page_title||'SONG REQUEST';$('#adminTitle').textContent=room.display_name+' 管理モード';document.title=room.display_name+' | '+(room.page_title||'SONG REQUEST');const m=room.hero_message||'あなたのリクエストが、この夜のステージをつくる。';$('#heroMessage').innerHTML=esc(m).replace('、','、<br>');r=await fetch(URL+'/rest/v1/song_request_songs?select=*&streamer_id=eq.'+room.id+'&active=eq.true&order=sort_order.asc,created_at.asc',{headers:{apikey:KEY}});songs=await r.json();render()}catch(e){$('#total').textContent='0';$('#streamer').textContent='このルームは利用できません';$('#list').innerHTML='<div class="empty">歌リストが見つかりません<br>URLをご確認ください。</div>';$('#secret').style.display='none'}}
function km(g,k){if(k==='all')return true;if(k==='AZ')return /^[A-Za-z0-9]/.test(g.artist||'');const m={あ:'あいうえお',か:'かきくけこ',さ:'さしすせそ',た:'たちつてと',な:'なにぬねの',は:'はひふへほ',ま:'まみむめも',や:'やゆよ',ら:'らりるれろ',わ:'わをん'};return(m[k]||'').includes(g.kana_group)}
function arr(){const q=norm(state.q);return songs.filter(s=>{let f=true;if(state.f==='original')f=s.category==='original';if(state.f==='recommend')f=s.recommend;if(state.f==='popular')f=s.popular;if(state.f==='new')f=s.is_new;if(state.f==='limited')f=s.limited;if(state.f==='favorite')f=fav.has(s.id);return(!q||norm(s.title+s.artist+s.note).includes(q))&&f&&km(s,state.k)})}
function render(){const a=arr();$('#total').textContent=songs.length;$('#resultCount').textContent=a.length+'件';const lab={all:'歌える曲',original:'オリジナル曲',recommend:'おすすめ',popular:'よく歌う曲',new:'新曲',limited:'▲注記あり',favorite:'お気に入り'};$('#sectionTitle').textContent=lab[state.f]||'歌える曲';$('#list').innerHTML=a.length?a.map(s=>{let tags=(s.category==='original'?'<span class="tag p">ORIGINAL</span>':'')+(s.recommend?'<span class="tag p">おすすめ</span>':'')+(s.popular?'<span class="tag">よく歌う</span>':'')+(s.is_new?'<span class="tag p">NEW</span>':'')+(s.limited?'<span class="tag w">▲注記あり</span>':'');return '<article class="card"><div class="cover">♫</div><div class="info"><div class="title">'+esc(s.title)+'</div><div class="artist">'+esc(s.artist)+'</div><div class="tags">'+tags+'</div></div><div class="acts"><button class="fav '+(fav.has(s.id)?'on':'')+'" data-fav="'+s.id+'">♥</button><button class="edit" data-edit="'+s.id+'">✎</button><button class="req" data-req="'+s.id+'">リクエスト</button></div></article>'}).join(''):'<div class="empty">曲が見つかりませんでした</div>'}
function adminUI(){document.body.classList.toggle('admin',!!token);$('#login').hidden=!!token;$('#menu').hidden=!token}
async function call(p){let h={'Content-Type':'application/json'};if(token)h['x-admin-token']=token;let r=await fetch(ADMIN,{method:'POST',headers:h,body:JSON.stringify(p)}),d=await r.json();if(!r.ok){if(r.status===401&&p.action!=='login'){token='';sessionStorage.removeItem(TOKKEY);adminUI()}throw Error(d.error||'処理に失敗しました')}return d}
function edit(s){$('#songId').value=s?.id||'';$('#editTitle').textContent=s?'曲を編集':'曲を追加';$('#fTitle').value=s?.title||'';$('#fArtist').value=s?.artist||'';$('#fKana').value=s?.kana_group||'あ';$('#fNote').value=s?.note||'';$('#fOriginal').checked=s?.category==='original';$('#fLimited').checked=!!s?.limited;$('#fRecommend').checked=!!s?.recommend;$('#fPopular').checked=!!s?.popular;$('#fNew').checked=!!s?.is_new;$('#fActive').checked=s?.active!==false;$('#deleteBtn').style.display=s?'block':'none';open('edit')}
$('#search').oninput=e=>{state.q=e.target.value;render()};$('#filters').onclick=e=>{let b=e.target.closest('[data-f]');if(!b)return;state.f=b.dataset.f;$$('[data-f]').forEach(x=>x.classList.toggle('active',x===b));render()};$('#kana').onclick=e=>{let b=e.target.closest('[data-k]');if(!b)return;state.k=b.dataset.k;$$('[data-k]').forEach(x=>x.classList.toggle('active',x===b));render()};
$('#list').onclick=e=>{let b=e.target.closest('[data-fav]');if(b){let id=b.dataset.fav;fav.has(id)?fav.delete(id):fav.add(id);localStorage.setItem(FAVKEY,JSON.stringify([...fav]));render();return}b=e.target.closest('[data-edit]');if(b){edit(songs.find(x=>x.id===b.dataset.edit));return}b=e.target.closest('[data-req]');if(b){selected=songs.find(x=>x.id===b.dataset.req);$('#reqTitle').textContent=selected.title;$('#copyText').textContent='🎤「'+selected.title+' / '+selected.artist+'」リクエストお願いします！'+(selected.limited&&selected.note?' ※'+selected.note:'');open('request')}};
$('#copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('#copyText').textContent).catch(()=>{});close('request');toast('コピーしました')};$$('[data-close]').forEach(b=>b.onclick=()=>close(b.dataset.close));$$('.overlay').forEach(o=>o.onclick=e=>{if(e.target===o)o.classList.remove('show')});$$('[data-nav]').forEach(b=>b.onclick=()=>{state.f=b.dataset.nav;$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render();scrollTo(0,0)});$('#navSearch').onclick=()=>{$('#search').focus();scrollTo(0,0)};$('#secret').onclick=()=>{adminUI();open('admin')};
$('#loginBtn').onclick=async()=>{try{let d=await call({action:'login',room:SLUG,password:$('#pw').value});token=d.token;sessionStorage.setItem(TOKKEY,token);$('#pw').value='';adminUI();toast('ログインしました')}catch(e){toast(e.message)}};$('#logoutBtn').onclick=async()=>{try{await call({action:'logout'})}catch{}token='';sessionStorage.removeItem(TOKKEY);adminUI();close('admin')};$('#addBtn').onclick=()=>{close('admin');edit(null)};$('#fab').onclick=()=>edit(null);$('#changePw').onclick=()=>{close('admin');open('pwchange')};
$('#saveBtn').onclick=async()=>{let id=$('#songId').value,s={title:$('#fTitle').value.trim(),artist:$('#fArtist').value.trim(),kana_group:$('#fKana').value,category:$('#fOriginal').checked?'original':'artist',note:$('#fNote').value.trim(),limited:$('#fLimited').checked,recommend:$('#fRecommend').checked,popular:$('#fPopular').checked,is_new:$('#fNew').checked,active:$('#fActive').checked};if(!s.title||!s.artist)return toast('曲名とアーティスト名は必須です');try{await call(id?{action:'update',id,song:s}:{action:'add',song:s});close('edit');await load();toast(id?'更新しました':'追加しました')}catch(e){toast(e.message)}};$('#deleteBtn').onclick=async()=>{let id=$('#songId').value;if(!confirm('この曲を削除しますか？'))return;try{await call({action:'delete',id});close('edit');await load();toast('削除しました')}catch(e){toast(e.message)}};$('#savePw').onclick=async()=>{let a=$('#newPw').value,b=$('#newPw2').value;if(a.length<6||a!==b)return toast('6文字以上で同じPWを入力してください');try{await call({action:'change_password',new_password:a});close('pwchange');toast('PWを変更しました')}catch(e){toast(e.message)}};
adminUI();load();
</script>
</body></html>
